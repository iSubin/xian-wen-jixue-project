services:
  postgres:
    image: postgres:16-alpine
    container_name: shengwen-postgres
    environment:
      POSTGRES_DB: shengwen
      POSTGRES_USER: shengwen
      POSTGRES_PASSWORD: shengwen_dev_password
    ports:
      - "54329:5432"
    volumes:
      - shengwen-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shengwen -d shengwen"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  shengwen-postgres-data:
