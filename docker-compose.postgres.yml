services:
  postgres:
    image: postgres:16-alpine
    container_name: xianwen-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: xianwen
      POSTGRES_USER: xianwen
      POSTGRES_PASSWORD: ${XIANWEN_POSTGRES_PASSWORD:-xianwen_dev_password}
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - xianwen-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U xianwen -d xianwen"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  xianwen-postgres-data:
